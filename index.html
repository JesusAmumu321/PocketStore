<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="PocketStore: catálogo de productos disponible incluso sin conexión."
    >
    <meta name="theme-color" content="#12372a">
    <link rel="manifest" href="./manifest.json">
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312372a'/%3E%3Cpath d='M18 24h28l-2 25H20l-2-25Z' fill='%23f4f1e8'/%3E%3Cpath d='M25 25v-5a7 7 0 0 1 14 0v5' fill='none' stroke='%23e3a74f' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
    >
    <link rel="stylesheet" href="./styles.css">
    <title>PocketStore</title>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__content">
        <a class="brand" href="./" aria-label="Ir al inicio de PocketStore">
          <span class="brand__mark" aria-hidden="true">P</span>
          <span>PocketStore</span>
        </a>
        <span class="topbar__label">Catálogo</span>
      </div>
    </header>

    <main class="main-content">
      <section class="catalog" aria-labelledby="catalog-title">
        <div class="catalog__heading">
          <div>
            <p class="eyebrow">Productos disponibles</p>
            <h1 id="catalog-title">Encuentra algo para ti</h1>
          </div>
          <p id="load-status" class="status" role="status" aria-live="polite">
            Cargando productos…
          </p>
        </div>

        <div id="product-list" class="product-grid" aria-busy="true"></div>
      </section>
    </main>

    <footer class="footer">
      <p>© <span id="current-year"></span> PocketStore · Catálogo offline</p>
    </footer>

    <script src="./app.js" defer></script>
  </body>
</html>
